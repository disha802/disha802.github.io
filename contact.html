                <div class="contact-form-container"
                    style="margin-top: 3rem; padding: 2rem;">
                    <form action="https://formspree.io/f/maqeewog" method="POST">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                            <div class="form-group">
                                <label for="name"
                                    style="display: block; margin-bottom: 0.5rem; font-size: 0.75rem; color: #cdd6de;">Name</label>
                                <input type="text" id="name" name="name" required
                                    style="width: 100%; border-radius: 8px; padding: 0.8rem; color: white; outline: none;">
                            </div>
                            <div class="form-group">
                                <label for="email"
                                    style="display: block; margin-bottom: 0.5rem; font-size: 0.75rem; color: #cdd6de;">Email</label>
                                <input type="email" id="email" name="email" required
                                    style="width: 100%; border-radius: 8px; padding: 0.8rem; color: white; outline: none;">
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom: 1.5rem;">
                            <label for="message"
                                style="display: block; margin-bottom: 0.5rem; font-size: 0.75rem; color: #cdd6de;">Message</label>
                            <textarea id="message" name="message" required rows="4"
                                style="width: 100%; border-radius: 8px; padding: 0.8rem; color: white; outline: none; resize: none;"></textarea>
                        </div>
                        <button type="submit"
                            style="width: 100%; border: none; border-radius: 12px; padding: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease;"
                            onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 24px rgba(255,255,255,0.3)'"
                            onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none'">Send
                            Message</button>
                    </form>
                    <div id="form-status"
                        style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; display: none; padding: 1rem; border-radius: 8px;">
                    </div>
                </div>
